<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: #0e0e14; display: flex; font-family: monospace; color: #888; overflow: hidden; }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
  .main > splattie-widget { flex: 1; }

  .editor-home {
    position: fixed; top: 10px; left: 10px; z-index: 30;
    display: inline-flex; align-items: center; gap: 7px;
    height: 30px; padding: 0 10px 0 8px; border-radius: 4px;
    border: 1px solid rgba(126,184,240,0.32);
    background: rgba(8,8,12,0.78); color: #d7eaff;
    font: 700 11px/1 ui-monospace, monospace; letter-spacing: 0.02em;
    cursor: pointer; backdrop-filter: blur(8px);
  }
  .editor-home:hover { border-color: #7eb8f0; color: #fff; }
  .editor-home img { width: 16px; height: 15px; display: block; }

  #pose-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 5; display: none; }
  #pose-overlay.active { display: block; }
  .rig-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .rig-lines line { stroke: rgba(126,184,240,0.34); stroke-width: 1.2; }
  .ik-handle {
    position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px;
    border-radius: 50%; background: rgba(126,184,240,0.45); border: 2px solid #7eb8f0;
    cursor: grab; pointer-events: auto; touch-action: none; transition: background 0.1s;
  }
  .ik-handle:hover { background: rgba(126,184,240,0.7); }
  .ik-handle.selected { background: rgba(96,208,128,0.65); border-color: #60d080; }
  .ik-handle.dragging { cursor: grabbing; background: rgba(196,160,240,0.8); border-color: #c4a0f0; }
  .pose-hint { font-size: 0.6rem; color: #555; margin: 0.2rem 0; line-height: 1.4; }
  .pose-btn {
    width: 100%; padding: 0.4rem; background: #1e1e2a; border: 1px solid #2a2a3a;
    color: #7eb8f0; font: inherit; font-size: 0.7rem; cursor: pointer; margin-top: 0.2rem;
  }
  .pose-btn.active { background: #7eb8f0; color: #0e0e14; font-weight: bold; }
  .rig-joint {
    margin: 0.55rem 0 0.25rem; padding-top: 0.45rem; border-top: 1px solid #1e1e2a;
    color: #888; font-size: 0.62rem; word-break: break-word;
  }
  .rig-joint:first-child { margin-top: 0.15rem; padding-top: 0; border-top: none; }
  .rig-meta { color: #444; font-size: 0.56rem; margin-top: 1px; }
  .rig-select { display: flex; flex-wrap: wrap; gap: 4px; margin: 0.45rem 0 0.55rem; }
  .rig-chip {
    border: 1px solid #2a2a3a; background: #1a1a24; color: #777;
    font: inherit; font-size: 0.58rem; padding: 3px 5px; cursor: pointer; border-radius: 2px;
    max-width: 100%; overflow-wrap: anywhere;
  }
  .rig-chip.selected { border-color: #60d080; color: #d8ffe4; }

  .panel {
    width: 240px;
    background: #12121a;
    border-left: 1px solid #1e1e2a;
    overflow-y: auto;
    padding: 0.75rem;
    font-size: 0.7rem;
    flex-shrink: 0;
  }

  .states { display: flex; gap: 2px; margin-bottom: 0.75rem; }
  .state-btn {
    flex: 1; padding: 0.35rem; background: #1e1e2a; border: 1px solid #2a2a3a;
    color: #555; font: inherit; cursor: pointer; text-align: center; position: relative;
  }
  .state-btn.editing { color: #7eb8f0; border-color: #7eb8f0; }
  .state-btn.live { box-shadow: 0 0 0 1px #60d080 inset; }
  .state-btn.configured::after {
    content: ''; position: absolute; top: 3px; right: 3px;
    width: 5px; height: 5px; border-radius: 50%; background: #60d080;
  }

  .copy-row { margin-bottom: 0.75rem; }
  .copy-btn {
    width: 100%; padding: 0.3rem; background: #1a1a24; border: 1px solid #2a2a3a;
    color: #777; font: inherit; font-size: 0.62rem; cursor: pointer; border-radius: 2px;
    letter-spacing: 0.02em;
  }
  .copy-btn:hover { color: #7eb8f0; border-color: #7eb8f0; }

  .dropzone {
    flex: 1; margin: 1.5rem; border: 1px dashed #2a2a3a; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    color: #555; text-align: center; transition: border-color 0.15s, color 0.15s;
  }
  .dropzone:hover, .dropzone.drag { border-color: #7eb8f0; }
  .dz-title { font-size: 0.8rem; color: #888; margin-bottom: 0.3rem; }
  .dropzone:hover .dz-title, .dropzone.drag .dz-title { color: #7eb8f0; }
  .dz-sub { font-size: 0.65rem; }
  .dz-btn {
    margin-top: 0.6rem; padding: 0.4rem 0.9rem; background: #7eb8f0; border: none;
    color: #0e0e14; font: inherit; font-weight: bold; font-size: 0.7rem;
    cursor: pointer; border-radius: 3px;
  }
  .dz-btn:hover { opacity: 0.9; }

  .stage-msg {
    flex: 1; margin: 1.5rem; display: flex; flex-direction: column; gap: 0.8rem;
    align-items: center; justify-content: center; text-align: center;
    color: #888; font-size: 0.8rem; padding: 1rem;
  }
  .stage-msg.error { color: #f0a0a0; }
  .stage-msg .stage-text { max-width: 340px; line-height: 1.5; }

  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin: 0.6rem 0 0.15rem; cursor: pointer; user-select: none;
  }
  .section-header span { color: #555; font-size: 0.6rem; letter-spacing: 0.05em; text-transform: uppercase; }
  .section-header .toggle { color: #444; font-size: 0.7rem; }
  .section-body { overflow: hidden; }
  .section-body.collapsed { display: none; }

  .slider-group { margin: 0.3rem 0; }
  .slider-top { display: flex; align-items: center; justify-content: space-between; }
  .slider-top label { color: #666; font-size: 0.65rem; }
  .slider-top .val-controls { display: flex; align-items: center; gap: 3px; }
  .slider-top .val {
    color: #7eb8f0; font-size: 0.65rem; min-width: 40px; text-align: right;
    background: #1a1a24; padding: 1px 4px; border-radius: 2px;
  }
  .pm-btn {
    width: 14px; height: 14px; background: #1e1e2a; border: 1px solid #333;
    color: #555; font: 9px monospace; cursor: pointer; line-height: 12px;
    text-align: center; padding: 0; flex-shrink: 0; border-radius: 2px;
  }
  .pm-btn:hover { color: #aaa; border-color: #555; }
  .slider-group input[type=range] { width: 100%; accent-color: #7eb8f0; height: 12px; margin-top: 2px; }

  .cam-sphere {
    width: 100%; height: 80px; position: relative; margin: 4px 0;
    background: #1a1a24; border-radius: 4px; overflow: hidden; cursor: crosshair;
  }
  .cam-sphere canvas { width: 100%; height: 100%; }
  .cam-sphere-label { position: absolute; bottom: 2px; right: 4px; font-size: 0.5rem; color: #444; }

  .easing-group { margin: 0.3rem 0; }
  .easing-group label { color: #666; font-size: 0.65rem; }
  .easing-group select {
    width: 100%; margin-top: 2px; background: #1a1a24; border: 1px solid #2a2a3a;
    color: #7eb8f0; font: inherit; font-size: 0.65rem; padding: 2px 4px; cursor: pointer;
  }

  .export-btn {
    width: 100%; margin-top: 1rem; padding: 0.5rem;
    background: #7eb8f0; border: none; color: #0e0e14;
    font: inherit; font-weight: bold; cursor: pointer; font-size: 0.75rem;
  }
  .export-btn:hover { opacity: 0.9; }

  .footer-actions { display: flex; gap: 6px; margin-top: 1rem; }
  .secondary-btn {
    flex: 1; padding: 0.5rem; background: #1a1a24; border: 1px solid #2a2a3a;
    color: #888; font: inherit; font-size: 0.7rem; cursor: pointer; border-radius: 2px;
  }
  .secondary-btn:hover { color: #aaa; border-color: #555; }
  .secondary-btn.danger:hover { color: #f0a0a0; border-color: #5a3030; }
  .footer-actions + .export-btn { margin-top: 6px; }

  @media (max-width: 600px) {
    body { flex-direction: column; }
    .panel { width: 100%; height: 40%; border-left: none; border-top: 1px solid #1e1e2a; }
  }
</style></head>
<body>
  <button class="editor-home" id="editor-home" type="button" aria-label="Back to Splattie">
    <img src="/logo.svg" alt="">
    <span>Splattie</span>
  </button>
  <div class="main" id="main"></div>
  <div class="panel" id="panel"></div>

  <script src="/splattie-widget.cdn.js?v=quadruped-pivotfix"></script>
  <script type="module">
    import { inspectSplattie } from '/splattie-format.js';

    const params = new URLSearchParams(location.search);
    const main = document.getElementById('main');
    const panel = document.getElementById('panel');

    let currentSrc = params.get('src');
    let widget = null;
    let liveInterval = null;

    // Overlay for body-pose IK drag handles (over the widget canvas). It is
    // (re)created alongside the widget in mountWidget() since clearStage()
    // wipes `main`; pose-mode state lives with the other editor state below.
    let poseOverlay = null;
    let poseMode = false;
    let poseRaf = 0;
    let draggingChain = null;
    let selectedObjectJoint = null;

    let config = null;
    let defaults = null;
    let currentState = 'idle';
    const configured = new Set();
    const collapsed = new Set(['flame blendshapes', 'transition']);

    // Editor is cursor-driven by design. Do NOT add `editor-mode` here, and do
    // NOT force a state transition on tab click. The state tab only chooses
    // which state's sliders are shown for editing - the widget's actual state
    // follows the cursor (hover -> hover, click -> click, leave -> idle). Edits
    // become visible only when the widget is in the state being edited.
    //
    // The widget only reads `src` in connectedCallback, so loading a new file
    // means recreating the element rather than mutating the attribute.
    document.getElementById('editor-home').onclick = function () {
      try {
        if (document.referrer) {
          var referrer = new URL(document.referrer);
          if (referrer.origin === location.origin && history.length > 1) {
            history.back();
            return;
          }
        }
      } catch (e) {}
      try {
        if (window.parent && window.parent !== window) {
          window.parent.location.href = '/';
          return;
        }
      } catch (e) {}
      location.href = '/';
    };

    function clearStage() {
      if (liveInterval) { clearInterval(liveInterval); liveInterval = null; }
      if (poseRaf) { cancelAnimationFrame(poseRaf); poseRaf = 0; }
      if (widget) { widget.remove(); widget = null; }
      poseOverlay = null;
      poseMode = false;
      draggingChain = null;
      selectedObjectJoint = null;
      main.innerHTML = '';
    }

    function showStageMessage(text, isError) {
      clearStage();
      const box = document.createElement('div');
      box.className = 'stage-msg' + (isError ? ' error' : '');
      const line = document.createElement('div');
      line.className = 'stage-text';
      line.textContent = text;
      box.appendChild(line);
      if (isError) {
        const retry = document.createElement('button');
        retry.className = 'dz-btn';
        retry.textContent = 'Try another file';
        retry.onclick = showUploadZone;
        box.appendChild(retry);
      }
      main.appendChild(box);
      panel.innerHTML = '';
      panel.textContent = isError ? 'Could not open this .splattie.' : 'Loading...';
    }

    // Validate the .splattie before handing it to the widget so we can explain
    // *why* it was rejected (missing manifest, version mismatch, etc.) instead
    // of failing silently the way the widget does on its own.
    async function loadSource(srcUrl) {
      showStageMessage('Loading .splattie...', false);
      try {
        const { default: JSZip } = await import('https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm');
        const res = await fetch(srcUrl);
        if (!res.ok) { showStageMessage(`Could not fetch the .splattie (HTTP ${res.status}).`, true); return; }
        const zip = await JSZip.loadAsync(await res.arrayBuffer());
        const names = Object.keys(zip.files).filter((n) => !zip.files[n].dir);
        const manifestEntry = zip.file('manifest.json');
        const manifest = manifestEntry ? JSON.parse(await manifestEntry.async('text')) : null;
        const expected = (window.SplattieWidget && window.SplattieWidget.VERSION) || null;
        const result = inspectSplattie(manifest, names, expected);
        if (!result.ok) { showStageMessage(result.message, true); return; }
        mountWidget(srcUrl);
      } catch (err) {
        showStageMessage('Could not read .splattie: ' + (err && err.message ? err.message : String(err)), true);
      }
    }

    function mountWidget(srcUrl) {
      clearStage();
      widget = document.createElement('splattie-widget');
      widget.id = 'widget';
      widget.setAttribute('background', '#0e0e14');
      widget.setAttribute('expression-basis', '/demos/expression_basis.bin?v=2');
      widget.setAttribute('src', srcUrl);
      widget.style.flex = '1';
      widget.addEventListener('splatload', onSplatLoad);
      main.appendChild(widget);

      // Overlay for body-pose IK drag handles, layered over the widget canvas.
      // Lives inside `main` (position: relative) so its `inset: 0` covers the canvas.
      poseOverlay = document.createElement('div');
      poseOverlay.id = 'pose-overlay';
      main.appendChild(poseOverlay);
    }

    function onSplatLoad() {
      // Tell a same-origin embedder (the landing page) the splat is live so it
      // can drop its poster overlay. Harmless when opened standalone (posts to self).
      parent.postMessage({ type: 'splattie:loaded' }, location.origin);

      const wConfig = widget.config;
      if (wConfig) {
        config = JSON.parse(JSON.stringify(wConfig));
      } else {
        config = { defaults: { camera: { theta: 0, phi: 75, radius: 0.5, fov: 60 } },
          states: { idle: {}, hover: {}, click: {} }, transitions: {} };
      }
      defaults = JSON.parse(JSON.stringify(config));
      currentState = Object.keys(config.states)[0] || 'idle';
      configured.clear();
      buildPanel();
      liveInterval = setInterval(() => {
        const live = widget._stateMachine?.activeStateName;
        document.querySelectorAll('.state-btn').forEach(btn => {
          btn.classList.toggle('live', btn.textContent === live);
        });
      }, 100);
    }

    // Empty editor mode: no ?src= - let anyone drop in their own .splattie.
    // The blob URL gets a `#...splattie` fragment so the widget takes its ZIP
    // path (it keys off the URL containing ".splattie", like its splat hints).
    function showUploadZone() {
      clearStage();
      panel.innerHTML = '';
      panel.textContent = 'Upload a .splattie to edit it.';
      const zone = document.createElement('div');
      zone.className = 'dropzone';
      const inner = document.createElement('div');
      inner.innerHTML = '<div class="dz-title">Drop a .splattie here</div><div class="dz-sub">or</div>';
      const button = document.createElement('button');
      button.className = 'dz-btn';
      button.textContent = 'Choose file';
      inner.appendChild(button);
      zone.appendChild(inner);
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.splattie,application/zip';
      input.style.display = 'none';
      zone.appendChild(input);
      const open = (file) => {
        if (!file) return;
        currentSrc = URL.createObjectURL(file) + '#upload.splattie';
        loadSource(currentSrc);
      };
      input.onchange = () => open(input.files && input.files[0]);
      zone.onclick = () => input.click();
      button.onclick = (e) => { e.stopPropagation(); input.click(); };
      zone.ondragover = (e) => { e.preventDefault(); zone.classList.add('drag'); };
      zone.ondragleave = () => zone.classList.remove('drag');
      zone.ondrop = (e) => { e.preventDefault(); zone.classList.remove('drag'); open(e.dataTransfer.files && e.dataTransfer.files[0]); };
      main.appendChild(zone);
    }

    if (currentSrc) loadSource(currentSrc);
    else showUploadZone();

    function buildPanel() {
      panel.innerHTML = '';

      const statesDiv = document.createElement('div');
      statesDiv.className = 'states';
      const liveState = widget._stateMachine?.activeStateName;
      for (const name of Object.keys(config.states)) {
        const btn = document.createElement('button');
        btn.className = 'state-btn' + (name === currentState ? ' editing' : '') + (name === liveState ? ' live' : '') + (configured.has(name) ? ' configured' : '');
        btn.textContent = name;
        btn.onclick = () => { currentState = name; buildPanel(); if (poseMode) widget._stateMachine?.forceState(currentState); };
        statesDiv.appendChild(btn);
      }
      panel.appendChild(statesDiv);

      // Cascade copy: idle is the base (-> hover + click), hover refines it (-> click),
      // click is the end of the chain. Copy the downstream states only - the states that
      // come after the current one in idle -> hover -> click order.
      const stateNames = Object.keys(config.states);
      const downstream = stateNames.slice(stateNames.indexOf(currentState) + 1);
      if (downstream.length) {
        const copyRow = document.createElement('div');
        copyRow.className = 'copy-row';
        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.textContent = `copy ${currentState} → ${downstream.join(' + ')}`;
        copyBtn.title = `Copy ${currentState} settings to ${downstream.join(' and ')}`;
        copyBtn.onclick = () => copyStateTo(downstream);
        copyRow.appendChild(copyBtn);
        panel.appendChild(copyRow);
      }

      const state = config.states[currentState];
      const def = defaults.states[currentState];
      const isHead = widget.assetType === 'head';
      const isBody = widget.assetType === 'body';
      const isObject = widget.assetType === 'object';

      // FLAME blendshapes are head-only. Bodies expose semantic head/torso
      // tracking, while arbitrary objects only expose category-agnostic controls.
      if (isHead) addSection('expression', () => {
        if (!state.expression) state.expression = {};
        if (!def.expression) def.expression = {};
        const boneKeys = ['smile', 'mouthFrown', 'lipPucker', 'jawOpen', 'browRaiseL', 'browRaiseR', 'browFrownL', 'browFrownR', 'eyeSquint', 'cheekPuff', 'noseSneer', 'neckTilt', 'neckYaw', 'neckRoll', 'gazeX', 'gazeY'];
        const ranges = { jawOpen: [0, 0.3, 0.005], neckTilt: [-0.3, 0.3, 0.005], neckYaw: [-0.3, 0.3, 0.005], neckRoll: [-0.3, 0.3, 0.005], gazeX: [-0.1, 0.1, 0.002], gazeY: [-0.05, 0.05, 0.001] };
        for (const k of boneKeys) {
          if (state.expression[k] === undefined) state.expression[k] = def.expression[k] || 0;
          if (def.expression[k] === undefined) def.expression[k] = 0;
          const [min, max, step] = ranges[k] || [0, 1, 0.01];
          addSlider(k, state.expression, k, min, max, step, undefined, def.expression[k]);
        }
      });

      addSection('ghost', () => {
        addSlider('amplitude', state.ghost, 'amplitude', 0, 0.02, 0.0005, undefined, def.ghost.amplitude);
        addSlider('frequency', state.ghost, 'frequency', 0, 2, 0.05, undefined, def.ghost.frequency);
        addSlider('wobble', state.ghost, 'wobble', 0, 1, 0.02, undefined, def.ghost.wobble);
      });

      addSection('camera', () => {
        addCameraSphere(state.camera, def.camera);
        addSlider('radius', state.camera, 'radius', 0.1, 10, 0.01, undefined, def.camera.radius);
        addSlider('fov', state.camera, 'fov', 20, 120, 0.5, undefined, def.camera.fov);
      });

      addSection('rotation', () => {
        addSlider('pitch', state, 'rotation', -30, 30, 0.1, 0, def.rotation[0]);
        addSlider('yaw', state, 'rotation', -30, 30, 0.1, 1, def.rotation[1]);
        addSlider('roll', state, 'rotation', -30, 30, 0.1, 2, def.rotation[2]);
      });

      if (isObject) addSection('follow', () => {
        if (state.tracking.torso === undefined) state.tracking.torso = def.tracking.torso ?? 0;
        if (state.tracking.head === undefined) state.tracking.head = def.tracking.head ?? 0;
        addSlider('root', state.tracking, 'torso', 0, 1, 0.01, undefined, def.tracking.torso ?? 0);
        addSlider('joints', state.tracking, 'head', 0, 1, 0.01, undefined, def.tracking.head ?? 0);
      });

      if (!isObject) addSection('tracking', () => {
        if (isBody) {
          if (state.tracking.torso === undefined) state.tracking.torso = def.tracking.torso ?? 0;
          addSlider('head', state.tracking, 'head', 0, 1, 0.01, undefined, def.tracking.head ?? 1);
          addSlider('torso', state.tracking, 'torso', 0, 1, 0.01, undefined, def.tracking.torso ?? 0);
          return;
        }
        addSlider('eyes', state.tracking, 'eyes', 0, 1, 0.01, undefined, def.tracking.eyes);
        addSlider('head', state.tracking, 'head', 0, 1, 0.01, undefined, def.tracking.head);
      });

      if (isObject) addSection('rig', () => addObjectRigControls(state));

      if (isBody || isObject) addSection('pose', () => {
        const hint = document.createElement('div');
        hint.className = 'pose-hint';
        hint.textContent = isObject
          ? 'Pose this state by dragging skeleton handles on terminal joints.'
          : 'Pose this state by dragging the dots on the hands & feet.';
        getContainer().appendChild(hint);
        const btn = document.createElement('button');
        btn.className = 'pose-btn' + (poseMode ? ' active' : '');
        btn.textContent = poseMode ? '✓ done posing' : '✎ edit pose';
        btn.onclick = () => setPoseMode(!poseMode);
        getContainer().appendChild(btn);
        if (state.pose && Object.keys(state.pose).length) {
          const reset = document.createElement('button');
          reset.className = 'pose-btn';
          reset.textContent = 'reset pose';
          reset.onclick = () => {
            delete config.states[currentState].pose;
            configured.add(currentState);
            applyConfig();
            if (poseMode) { widget._stateMachine?.forceState(currentState); buildHandles(); }
          };
          getContainer().appendChild(reset);
        }
      });

      const footer = document.createElement('div');
      footer.className = 'footer-actions';
      const resetBtn = document.createElement('button');
      resetBtn.className = 'secondary-btn';
      resetBtn.textContent = 'Reset edits';
      resetBtn.title = 'Revert all edits to the loaded file\'s original settings';
      resetBtn.onclick = resetEdits;
      const clearBtn = document.createElement('button');
      clearBtn.className = 'secondary-btn danger';
      clearBtn.textContent = 'Clear';
      clearBtn.title = 'Unload this avatar and choose another file';
      clearBtn.onclick = clearFile;
      footer.append(resetBtn, clearBtn);
      panel.appendChild(footer);

      const exportBtn = document.createElement('button');
      exportBtn.className = 'export-btn';
      exportBtn.textContent = 'Download .splattie';
      exportBtn.onclick = exportSplattie;
      panel.appendChild(exportBtn);
    }

    function addSection(title, buildContent) {
      const header = document.createElement('div');
      header.className = 'section-header';
      const label = document.createElement('span');
      label.textContent = title;
      const toggle = document.createElement('span');
      toggle.className = 'toggle';
      toggle.textContent = collapsed.has(title) ? '▸' : '▾';
      header.appendChild(label);
      header.appendChild(toggle);
      header.onclick = () => { collapsed.has(title) ? collapsed.delete(title) : collapsed.add(title); buildPanel(); };
      panel.appendChild(header);

      const body = document.createElement('div');
      body.className = 'section-body' + (collapsed.has(title) ? ' collapsed' : '');
      panel.appendChild(body);
      panel._currentBody = body;
      buildContent();
      delete panel._currentBody;
    }

    function getContainer() { return panel._currentBody || panel; }

    function addCameraSphere(cam, defCam) {
      const wrap = document.createElement('div');
      wrap.className = 'cam-sphere';
      const cvs = document.createElement('canvas');
      cvs.width = 200; cvs.height = 80;
      wrap.appendChild(cvs);
      const lbl = document.createElement('div');
      lbl.className = 'cam-sphere-label';
      wrap.appendChild(lbl);

      function draw() {
        const ctx = cvs.getContext('2d');
        const w = cvs.width, h = cvs.height, cx = w/2, cy = h/2, r = Math.min(cx, cy) - 8;
        ctx.clearRect(0, 0, w, h);
        ctx.strokeStyle = '#2a2a3a'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();
        ctx.strokeStyle = '#1e1e2a'; ctx.beginPath();
        ctx.moveTo(cx-r, cy); ctx.lineTo(cx+r, cy); ctx.moveTo(cx, cy-r); ctx.lineTo(cx, cy+r); ctx.stroke();
        const dotX = cx + (cam.theta/90)*r, dotY = cy - ((cam.phi-90)/90)*r;
        ctx.fillStyle = '#7eb8f0'; ctx.beginPath(); ctx.arc(dotX, dotY, 5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(dotX, dotY, 2, 0, Math.PI*2); ctx.fill();
        lbl.textContent = `θ ${cam.theta.toFixed(0)}° φ ${cam.phi.toFixed(0)}°`;
      }

      let dragging = false;
      function updateFromMouse(e) {
        const rect = cvs.getBoundingClientRect();
        cam.theta = Math.max(-90, Math.min(90, ((e.clientX-rect.left)/rect.width - 0.5)*180));
        cam.phi = Math.max(0, Math.min(180, (0.5-(e.clientY-rect.top)/rect.height)*180 + 90));
        configured.add(currentState); draw(); applyConfig();
      }
      cvs.onpointerdown = (e) => { dragging = true; cvs.setPointerCapture(e.pointerId); updateFromMouse(e); };
      cvs.onpointermove = (e) => { if (dragging) updateFromMouse(e); };
      cvs.onpointerup = () => { dragging = false; };
      cvs.ondblclick = () => { cam.theta = defCam.theta; cam.phi = defCam.phi; configured.add(currentState); draw(); applyConfig(); };
      draw();
      getContainer().appendChild(wrap);
    }

    function addSlider(label, obj, key, min, max, step, arrayIdx, defaultVal) {
      const group = document.createElement('div');
      group.className = 'slider-group';
      const top = document.createElement('div');
      top.className = 'slider-top';
      const lbl = document.createElement('label');
      lbl.textContent = label;
      const controls = document.createElement('div');
      controls.className = 'val-controls';
      const minus = document.createElement('button'); minus.className = 'pm-btn'; minus.textContent = '−';
      const val = document.createElement('span'); val.className = 'val';
      const plus = document.createElement('button'); plus.className = 'pm-btn'; plus.textContent = '+';
      controls.append(minus, val, plus);
      top.append(lbl, controls);

      const input = document.createElement('input');
      input.type = 'range'; input.min = min; input.max = max; input.step = step;
      const fmt = (v) => { const n = Number(v); return step < 0.005 ? n.toFixed(4) : step < 0.05 ? n.toFixed(3) : step < 0.5 ? n.toFixed(2) : n.toFixed(1); };
      const getValue = () => arrayIdx !== undefined ? obj[key][arrayIdx] : obj[key];
      const setValue = (v) => {
        v = Math.max(parseFloat(min), Math.min(parseFloat(max), v));
        if (arrayIdx !== undefined) obj[key][arrayIdx] = v; else obj[key] = v;
        configured.add(currentState); input.value = v; val.textContent = fmt(v); applyConfig();
      };
      input.value = getValue(); val.textContent = fmt(getValue());
      input.oninput = () => setValue(parseFloat(input.value));
      minus.onclick = () => setValue(getValue() - step);
      plus.onclick = () => setValue(getValue() + step);
      input.ondblclick = () => { if (defaultVal !== undefined) setValue(defaultVal); };
      group.append(top, input);
      getContainer().appendChild(group);
    }

    function getRigJoints() {
      if (widget.rigJoints) return widget.rigJoints();
      const bones = widget.spark && widget.spark.bones ? widget.spark.bones : [];
      return bones
        .filter((bone) => !bone.virtual)
        .map((bone) => ({ name: bone.name, index: bone.idx, parentIndex: bone.parentIdx }));
    }

    function normalizeQuat(q) {
      const x = Number(q && q[0]) || 0;
      const y = Number(q && q[1]) || 0;
      const z = Number(q && q[2]) || 0;
      const w = Number(q && q[3]) || 1;
      const len = Math.hypot(x, y, z, w) || 1;
      return [x / len, y / len, z / len, w / len];
    }

    function quatToEulerDegrees(q) {
      const [x, y, z, w] = normalizeQuat(q);
      const x2 = x + x, y2 = y + y, z2 = z + z;
      const xx = x * x2, xy = x * y2, xz = x * z2;
      const yy = y * y2, yz = y * z2, zz = z * z2;
      const wx = w * x2, wy = w * y2, wz = w * z2;
      const m11 = 1 - (yy + zz);
      const m12 = xy - wz;
      const m13 = xz + wy;
      const m23 = yz - wx;
      const m33 = 1 - (xx + yy);
      const clamp = (v) => Math.max(-1, Math.min(1, v));
      let rx, ry, rz;
      ry = Math.asin(clamp(m13));
      if (Math.abs(m13) < 0.9999999) {
        rx = Math.atan2(-m23, m33);
        rz = Math.atan2(-m12, m11);
      } else {
        const m22 = 1 - (xx + zz);
        const m32 = yz + wx;
        rx = Math.atan2(m32, m22);
        rz = 0;
      }
      const toDeg = 180 / Math.PI;
      return [rx * toDeg, ry * toDeg, rz * toDeg];
    }

    function quatFromEulerDegrees(rx, ry, rz) {
      const toRad = Math.PI / 180;
      const x = rx * toRad, y = ry * toRad, z = rz * toRad;
      const c1 = Math.cos(x / 2), c2 = Math.cos(y / 2), c3 = Math.cos(z / 2);
      const s1 = Math.sin(x / 2), s2 = Math.sin(y / 2), s3 = Math.sin(z / 2);
      return [
        s1 * c2 * c3 + c1 * s2 * s3,
        c1 * s2 * c3 - s1 * c2 * s3,
        c1 * c2 * s3 + s1 * s2 * c3,
        c1 * c2 * c3 - s1 * s2 * s3,
      ];
    }

    function addObjectRigControls(state) {
      const joints = getRigJoints();
      if (!joints.length) {
        const hint = document.createElement('div');
        hint.className = 'pose-hint';
        hint.textContent = 'This object bundle did not expose editable rig joints.';
        getContainer().appendChild(hint);
        return;
      }

      if (!state.pose) state.pose = {};
      const pose = state.pose;
      const hint = document.createElement('div');
      hint.className = 'pose-hint';
      hint.textContent = 'Select a skeleton joint, then tune its local rotation for this state.';
      getContainer().appendChild(hint);

      const names = new Set(joints.map((joint) => joint.name));
      if (!selectedObjectJoint || !names.has(selectedObjectJoint)) {
        const handles = widget.objectPoseHandles ? widget.objectPoseHandles() : [];
        selectedObjectJoint = handles[0]?.joint || joints.find((joint) => joint.parentIndex >= 0)?.name || joints[0].name;
      }
      const select = document.createElement('div');
      select.className = 'rig-select';
      for (const joint of joints) {
        const chip = document.createElement('button');
        chip.className = 'rig-chip' + (joint.name === selectedObjectJoint ? ' selected' : '');
        chip.textContent = joint.name;
        chip.title = joint.parentIndex < 0 ? 'root joint' : `parent ${joint.parentIndex}`;
        chip.onclick = () => {
          selectedObjectJoint = joint.name;
          if (poseMode) buildHandles();
          buildPanel();
        };
        select.appendChild(chip);
      }
      getContainer().appendChild(select);

      if (Object.keys(pose).length) {
        const reset = document.createElement('button');
        reset.className = 'pose-btn';
        reset.textContent = 'reset rig state';
        reset.onclick = () => {
          config.states[currentState].pose = {};
          configured.add(currentState);
          applyConfig();
          widget._stateMachine?.forceState(currentState);
          buildPanel();
        };
        getContainer().appendChild(reset);
      }

      const joint = joints.find((candidate) => candidate.name === selectedObjectJoint) || joints[0];
      const title = document.createElement('div');
      title.className = 'rig-joint';
      title.textContent = joint.name;
      const meta = document.createElement('div');
      meta.className = 'rig-meta';
      meta.textContent = joint.parentIndex < 0 ? 'root joint' : `parent ${joint.parentIndex}`;
      title.appendChild(meta);
      getContainer().appendChild(title);

      const euler = quatToEulerDegrees(pose[joint.name] || [0, 0, 0, 1]);
      addRigAxisSlider(joint.name, 'pitch', 0, euler, pose);
      addRigAxisSlider(joint.name, 'yaw', 1, euler, pose);
      addRigAxisSlider(joint.name, 'roll', 2, euler, pose);
    }

    function addRigAxisSlider(jointName, label, axisIndex, euler, pose) {
      const group = document.createElement('div');
      group.className = 'slider-group rig-axis';
      const top = document.createElement('div');
      top.className = 'slider-top';
      const lbl = document.createElement('label');
      lbl.textContent = label;
      const controls = document.createElement('div');
      controls.className = 'val-controls';
      const minus = document.createElement('button'); minus.className = 'pm-btn'; minus.textContent = '−';
      const val = document.createElement('span'); val.className = 'val';
      const plus = document.createElement('button'); plus.className = 'pm-btn'; plus.textContent = '+';
      controls.append(minus, val, plus);
      top.append(lbl, controls);

      const input = document.createElement('input');
      input.type = 'range'; input.min = -120; input.max = 120; input.step = 1;
      const fmt = (v) => Number(v).toFixed(0);
      const writeValue = (raw) => {
        const v = Math.max(-120, Math.min(120, Number(raw)));
        euler[axisIndex] = v;
        writeRigEuler(jointName, euler, pose);
        input.value = v;
        val.textContent = fmt(v);
      };
      input.value = euler[axisIndex];
      val.textContent = fmt(euler[axisIndex]);
      input.oninput = () => writeValue(input.value);
      input.ondblclick = () => writeValue(0);
      minus.onclick = () => writeValue(euler[axisIndex] - 1);
      plus.onclick = () => writeValue(euler[axisIndex] + 1);
      group.append(top, input);
      getContainer().appendChild(group);
    }

    function writeRigEuler(jointName, euler, pose) {
      if (euler.every((n) => Math.abs(n) < 0.001)) delete pose[jointName];
      else pose[jointName] = quatFromEulerDegrees(euler[0], euler[1], euler[2]);
      configured.add(currentState);
      applyConfig();
      widget._stateMachine?.forceState(currentState);
    }

    function applyConfig() {
      if (!widget._stateMachine) return;
      widget._stateMachine.updateStates(JSON.parse(JSON.stringify(config.states)));
    }

    // Copy the current state's full config onto the given downstream states.
    // Mutates config only - the widget's live state still follows the cursor.
    function copyStateTo(targets) {
      const snapshot = JSON.parse(JSON.stringify(config.states[currentState]));
      for (const target of targets) {
        config.states[target] = JSON.parse(JSON.stringify(snapshot));
        configured.add(target);
      }
      applyConfig();
      buildPanel();
    }

    // Revert every edit back to the config the file loaded with.
    function resetEdits() {
      if (!defaults) return;
      config = JSON.parse(JSON.stringify(defaults));
      currentState = Object.keys(config.states)[0] || 'idle';
      configured.clear();
      applyConfig();
      buildPanel();
    }

    // Unload the current avatar and return to the upload dropzone.
    function clearFile() {
      if (currentSrc && currentSrc.startsWith('blob:')) {
        URL.revokeObjectURL(currentSrc.split('#')[0]);
      }
      currentSrc = null;
      config = null;
      defaults = null;
      configured.clear();
      showUploadZone();
    }

    // ── Body IK pose authoring (drag handles over the canvas) ──
    // Pose is per-state (like camera/expression): editing one state's pose never
    // touches the others. Author idle/hover/click independently.
    function writePose(sol) {
      const st = config.states[currentState];
      if (!st.pose) st.pose = {};
      for (const j of sol) st.pose[j.joint] = j.quat;
      configured.add(currentState);
      applyConfig();
      widget._stateMachine?.forceState(currentState);
    }

    function clampToCanvas(sx, sy) {
      const c = widget.querySelector('canvas');
      const m = 12;
      return [Math.max(m, Math.min(c.clientWidth - m, sx)), Math.max(m, Math.min(c.clientHeight - m, sy))];
    }

    function setPoseMode(on) {
      poseMode = on;
      widget.poseAuthoring = on;            // freeze look-at so handles match the body
      if (widget._stateMachine) widget._stateMachine.frozen = on; // no transitions while posing
      poseOverlay.classList.toggle('active', on);
      cancelAnimationFrame(poseRaf);
      if (on) {
        widget._stateMachine?.forceState(currentState);
        buildHandles();
        const loop = () => { updateHandlePositions(); poseRaf = requestAnimationFrame(loop); };
        poseRaf = requestAnimationFrame(loop);
      } else {
        poseOverlay.innerHTML = '';
      }
      buildPanel();
    }

    function buildHandles() {
      poseOverlay.innerHTML = '';
      if (widget.assetType === 'object') {
        const graph = widget.objectRigGraph ? widget.objectRigGraph() : { edges: [], handles: widget.objectPoseHandles ? widget.objectPoseHandles() : [] };
        drawObjectRigLines(graph);
        const handles = graph.handles;
        for (const h of handles) {
          const dot = document.createElement('div');
          dot.className = 'ik-handle' + (h.joint === selectedObjectJoint ? ' selected' : '');
          dot.dataset.handle = h.handleJoint;
          dot.dataset.joint = h.joint;
          dot.title = `${h.handleJoint} → ${h.joint}`;
          dot.onclick = () => {
            selectedObjectJoint = h.joint;
            buildPanel();
            buildHandles();
          };
          dot.onpointerdown = (e) => startObjectPoseDrag(e, h, dot);
          poseOverlay.appendChild(dot);
        }
        updateHandlePositions();
        return;
      }

      const handles = widget.bodyIKHandles ? widget.bodyIKHandles() : [];
      for (const h of handles) {
        const dot = document.createElement('div');
        dot.className = 'ik-handle';
        dot.dataset.chain = h.chain;
        dot.title = h.chain.replace('_', ' ');
        dot.onpointerdown = (e) => startPoseDrag(e, h.chain, dot);
        poseOverlay.appendChild(dot);
      }
      updateHandlePositions();
    }

    // Re-project handle positions each frame so they track the camera (radius/zoom)
    // and the posed body; off-screen joints (e.g. feet) clamp to the canvas edge.
    function updateHandlePositions() {
      if (!poseMode) return;
      if (widget.assetType === 'object') {
        const graph = widget.objectRigGraph ? widget.objectRigGraph() : { edges: [], handles: widget.objectPoseHandles ? widget.objectPoseHandles() : [] };
        drawObjectRigLines(graph);
        const handles = graph.handles;
        for (const h of handles) {
          if (h.handleJoint === draggingChain) continue;
          const dot = poseOverlay.querySelector('[data-handle="' + h.handleJoint + '"]');
          if (dot) {
            const [x, y] = clampToCanvas(h.sx, h.sy);
            dot.style.left = x + 'px';
            dot.style.top = y + 'px';
            dot.classList.toggle('selected', h.joint === selectedObjectJoint);
          }
        }
        return;
      }
      if (!widget.bodyIKHandles) return;
      for (const h of widget.bodyIKHandles()) {
        if (h.chain === draggingChain) continue;
        const dot = poseOverlay.querySelector('[data-chain="' + h.chain + '"]');
        if (dot) { const [x, y] = clampToCanvas(h.sx, h.sy); dot.style.left = x + 'px'; dot.style.top = y + 'px'; }
      }
    }

    function drawObjectRigLines(graph) {
      let svg = poseOverlay.querySelector('.rig-lines');
      if (!svg) {
        svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.classList.add('rig-lines');
        poseOverlay.prepend(svg);
      }
      const rect = poseOverlay.getBoundingClientRect();
      svg.setAttribute('viewBox', `0 0 ${rect.width || 1} ${rect.height || 1}`);
      svg.replaceChildren();
      for (const edge of graph.edges || []) {
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', String(edge.x1));
        line.setAttribute('y1', String(edge.y1));
        line.setAttribute('x2', String(edge.x2));
        line.setAttribute('y2', String(edge.y2));
        svg.appendChild(line);
      }
    }

    function startPoseDrag(e, chain, dot) {
      e.preventDefault();
      draggingChain = chain;
      dot.classList.add('dragging');
      dot.setPointerCapture(e.pointerId);
      const canvas = widget.querySelector('canvas');
      const move = (ev) => {
        const rect = canvas.getBoundingClientRect();
        const sx = ev.clientX - rect.left, sy = ev.clientY - rect.top;
        const sol = widget.solveLimbToScreen(chain, sx, sy);
        if (sol) writePose(sol);
        const [cx, cy] = clampToCanvas(sx, sy);
        dot.style.left = cx + 'px';
        dot.style.top = cy + 'px';
      };
      const up = () => {
        draggingChain = null;
        dot.classList.remove('dragging');
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
      };
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
    }

    function startObjectPoseDrag(e, handle, dot) {
      e.preventDefault();
      selectedObjectJoint = handle.joint;
      draggingChain = handle.handleJoint;
      dot.classList.add('dragging');
      dot.setPointerCapture(e.pointerId);
      const state = config.states[currentState];
      if (!state.pose) state.pose = {};
      const pose = state.pose;
      const startX = e.clientX;
      const startY = e.clientY;
      const base = quatToEulerDegrees(pose[handle.joint] || [0, 0, 0, 1]);
      const move = (ev) => {
        const canvas = widget.querySelector('canvas');
        const rect = canvas.getBoundingClientRect();
        const [cx, cy] = clampToCanvas(ev.clientX - rect.left, ev.clientY - rect.top);
        const solved = widget.solveObjectHandleToScreen
          ? widget.solveObjectHandleToScreen(handle.handleJoint, cx, cy)
          : null;
        if (solved) writePose(solved);
        else {
          const dx = ev.clientX - startX;
          const dy = ev.clientY - startY;
          writeRigEuler(handle.joint, [
            Math.max(-120, Math.min(120, base[0] - dy * 0.45)),
            Math.max(-120, Math.min(120, base[1] + dx * 0.45)),
            base[2],
          ], pose);
        }
        dot.style.left = cx + 'px';
        dot.style.top = cy + 'px';
      };
      const up = () => {
        draggingChain = null;
        dot.classList.remove('dragging');
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
        buildPanel();
        if (poseMode) buildHandles();
      };
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
    }

    async function exportSplattie() {
      const { default: JSZip } = await import('https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm');
      if (!currentSrc) return;

      const res = await fetch(currentSrc);
      const originalZip = await JSZip.loadAsync(await res.arrayBuffer());
      const newZip = new JSZip();

      const manifestEntry = originalZip.file('manifest.json');
      if (!manifestEntry) {
        alert('Cannot export: original .splattie has no manifest.json. Regenerate the source bundle.');
        return;
      }
      const manifest = JSON.parse(await manifestEntry.async('text'));
      manifest.metadata = manifest.metadata || {};
      manifest.metadata.lastEditedAt = new Date().toISOString();
      manifest.metadata.editedBy = 'splattie-editor';

      const configName = (manifest.widget && manifest.widget.config) || 'states.json';

      for (const [name, file] of Object.entries(originalZip.files)) {
        if (file.dir) continue;
        if (name === 'manifest.json' || name === configName) continue;
        newZip.file(name, await file.async('blob'));
      }
      newZip.file('manifest.json', JSON.stringify(manifest, null, 2));
      newZip.file(configName, JSON.stringify(config, null, 2));

      const blob = await newZip.generateAsync({ type: 'blob' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'avatar.splattie';
      a.click();
    }
  </script>
    <script>
    // editor_open analytics + privacy notice. The editor is fully client-side:
    // the .splattie file is read and edited in the browser; nothing is uploaded.
    (function () {
      try {
        var loc = (navigator.languages && navigator.languages[0]) || navigator.language || '';
        var m = loc.match(/-([A-Za-z]{2})(?:$|-)/);
        var country = m ? m[1].toUpperCase() : '';
        var bodyData = JSON.stringify({ type: 'editor_open', path: '/editor.html', country: country || null });
        var url = 'https://api.splattie.app/track';
        if (navigator.sendBeacon) {
          navigator.sendBeacon(url, new Blob([bodyData], { type: 'text/plain' }));
        } else {
          fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: bodyData, keepalive: true }).catch(function () {});
        }
      } catch (e) { /* analytics must never break the editor */ }
      try {
        var tip = document.createElement('div');
        tip.textContent = 'Runs entirely in your browser \u2014 your file is never uploaded or stored.';
        tip.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:99999;max-width:320px;font:10px/1.4 ui-monospace,monospace;color:#7eb8f0;background:rgba(8,8,12,0.88);border:1px solid #1e1e2a;border-radius:4px;padding:6px 9px;pointer-events:none;opacity:1;transition:opacity 450ms ease';
        document.body.appendChild(tip);
        window.setTimeout(function () { tip.style.opacity = '0'; }, 4500);
        window.setTimeout(function () { tip.remove(); }, 5100);
      } catch (e) {}
    })();
    </script>
