---
services:
    web:
        build:
            context: .
            dockerfile: Dockerfile.web
        ports:
            - 4001:4001
        environment:
            - NEXT_PUBLIC_API_URL=https://api.splattie.ai
        restart: unless-stopped

    backend:
        build:
            context: .
            dockerfile: Dockerfile.backend
        ports:
            - 8000:8000
        volumes:
            - backend-data:/app/backend/data
        restart: unless-stopped
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: 1
                          capabilities: [gpu]

volumes:
    backend-data:
