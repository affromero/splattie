---
services:
    web:
        build:
            context: .
            dockerfile: Dockerfile.web
        ports:
            - 4001:4001
        environment:
            - NEXT_PUBLIC_API_URL=https://api.splattie.ai
      # Server-to-server URL the admin dashboard uses to read analytics.
            - BACKEND_INTERNAL_URL=http://backend:8000
      # Admin panel auth — injected by Doppler in production
      # (doppler run -- docker compose ...) or a local .env. Never committed.
            - ADMIN_PASSWORD=${ADMIN_PASSWORD:?provide ADMIN_PASSWORD via Doppler or .env}
            - SESSION_SECRET=${SESSION_SECRET:?provide SESSION_SECRET via Doppler or .env}
            - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:?provide ADMIN_API_TOKEN via Doppler or .env}
      # Optional: Google Search Console verification token.
            - GOOGLE_SITE_VERIFICATION=${GOOGLE_SITE_VERIFICATION:-}
        restart: unless-stopped

    backend:
        build:
            context: .
            dockerfile: Dockerfile.backend
        ports:
            - 8000:8000
        environment:
      # Must match the web service's ADMIN_API_TOKEN (guards GET /admin/stats).
            - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:?provide ADMIN_API_TOKEN via Doppler or .env}
      # Optional salt for the anonymized daily visitor hash.
            - STATS_SALT=${STATS_SALT:-}
        volumes:
            - backend-data:/app/backend/data
        restart: unless-stopped
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: 1
                          capabilities: [gpu]

volumes:
    backend-data:
