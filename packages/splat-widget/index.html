<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>*{margin:0}body{background:#0e0e14}</style></head>
<body>
<div id="status" style="position:fixed;top:10px;left:10px;color:#666;font:12px monospace;z-index:9"></div>
<script type="module">
import * as THREE from 'three';
import { SplatMesh, SparkRenderer } from '@sparkjsdev/spark';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const status = document.getElementById('status');
const log = (m) => { status.textContent = m; console.log(m); };

const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x0e0e14);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.001, 100);
const spark = new SparkRenderer({ renderer });
scene.add(spark);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

camera.position.set(0, 0, 0.5);
controls.target.set(0, 0, 0);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

log('loading your face...');
const splat = new SplatMesh({
  url: '/andres.ply',
  sphericalHarmonicsDegree: 0,
  onLoad: () => log('loaded — drag to orbit, scroll to zoom'),
});
scene.add(splat);

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body></html>
