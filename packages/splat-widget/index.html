<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>*{margin:0}body{background:#0e0e14}</style></head>
<body>
<div id="status" style="position:fixed;top:10px;left:10px;color:#666;font:12px monospace;z-index:9"></div>
<script type="module">
import * as THREE from 'three';
import { SplatMesh, SparkRenderer } from '@sparkjsdev/spark';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const status = document.getElementById('status');
const log = (m) => { status.textContent = m; console.log(m); };

const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x0e0e14);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.001, 100);
const spark = new SparkRenderer({ renderer });
scene.add(spark);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// Test each file
const files = [
  { url: 'https://sparkjs.dev/assets/splats/robot-head.spz', cam: [0,0,3], label: 'CDN robot-head.spz' },
  { url: '/andres.spz', cam: [0,0,0.4], label: 'local andres.spz (offset)' },
  { url: '/andres.ply', cam: [0,0,0.4], label: 'local andres.ply (offset)' },
  { url: '/andres_absolute.ply', cam: [0,0,0.5], label: 'local absolute.ply' },
  { url: '/andres_absolute.spz', cam: [0,0,0.5], label: 'local absolute.spz' },
];

let currentIdx = 0;
let currentMesh = null;

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') { currentIdx = (currentIdx + 1) % files.length; loadFile(); }
  if (e.key === 'ArrowLeft') { currentIdx = (currentIdx - 1 + files.length) % files.length; loadFile(); }
});

async function loadFile() {
  const f = files[currentIdx];
  log(`[${currentIdx+1}/${files.length}] loading ${f.label}...`);
  
  if (currentMesh) { scene.remove(currentMesh); }
  
  try {
    currentMesh = new SplatMesh({
      url: f.url,
      onLoad: () => log(`[${currentIdx+1}/${files.length}] ${f.label} — LOADED ✓ (arrow keys to switch)`),
    });
    currentMesh.quaternion.set(1, 0, 0, 0);
    scene.add(currentMesh);
    camera.position.set(...f.cam);
    controls.target.set(0, 0, 0);
  } catch(e) {
    log(`ERROR: ${e.message}`);
  }
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});

loadFile();
</script>
</body></html>
