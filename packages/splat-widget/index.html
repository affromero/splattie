<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin: 0; }
  body { background: #0e0e14; display: flex; align-items: center; justify-content: center; height: 100vh; }
  splat-widget { width: 800px; height: 600px; }
</style></head>
<body>
  <splat-widget
    src="/andres.ply"
    bones="/bone_tree.json"
    weights="/lbs_weight_20k.json"
    config="/states.json"
    background="#0e0e14"
  ></splat-widget>

  <script type="module">
    import './src/index.ts';

    const widget = document.querySelector('splat-widget');
    widget.addEventListener('splatload', () => console.log('splatload'));
    widget.addEventListener('splathover', () => console.log('splathover'));
    widget.addEventListener('splatleave', () => console.log('splatleave'));
    widget.addEventListener('splatclick', () => console.log('splatclick'));
  </script>
</body>
</html>
