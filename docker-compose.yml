services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "4001:4001"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/backend/data

volumes:
  backend-data:
