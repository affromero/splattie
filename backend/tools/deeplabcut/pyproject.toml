[project]
name = "splattie-deeplabcut-runtime"
version = "0.0.0"
requires-python = ">=3.11,<3.12"
dependencies = ["deeplabcut>=3.0", "numpy>=1.23,<2", "torch==2.3.0", "torchvision==0.18.0"]

[tool.uv]
# DeepLabCut's filelock<3.16 constraint predates both symlink security fixes.
override-dependencies = ["filelock==3.20.3"]

[[tool.uv.index]]
explicit = true
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"

[tool.uv.sources]
torch = [
  { index = "pytorch-cu121", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
  { git = "https://github.com/affromero/pytorch.git", rev = "1472255c78f9838aa30a8ee14296818bf2ba3687", marker = "sys_platform != 'linux' or platform_machine != 'x86_64'" }
]
torchvision = { index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }
