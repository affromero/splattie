[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "pre-commit>=4.0",
  "pytest-asyncio>=0.25.0",
  "pytest>=8.0",
  "ruff>=0.14",
  "toml-sort>=0.24"
]

[project]
authors = [{name = "Andrés Romero", email = "me@afromero.co"}]
dependencies = [
  "beartype>=0.19.0",
  "fastapi>=0.115.0",
  "jaxtyping>=0.2.34",
  "numpy>=1.23,<2",
  "pillow>=10.0",
  "pydantic>=2.10",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.0"
]
name = "splattie"
requires-python = ">=3.10"
version = "0.1.0"

[project.optional-dependencies]
# CPU-only: enough to run the FastAPI server (GPU routes return 503).
# uv sync --extra cpu
cpu = [
  "plyfile",
  "trimesh>=4.0"
]
# Full GPU pipeline: head-generation with LAM + FLAME. Requires CUDA 12.x.
# uv sync --extra gpu
# Additional CUDA extensions (pytorch3d, nvdiffrast, simple-knn) are
# installed by scripts/setup-gpu.sh because they need --no-build-isolation.
gpu = [
  "accelerate",
  "diffusers>=0.32",
  "einops",
  "face-detection-tflite",
  "gsplat",
  "huggingface-hub==0.23.2",
  "loguru",
  "matplotlib",
  "moviepy>=1.0",
  "ninja",
  "omegaconf>=2.3",
  "opencv-python-headless>=4.10",
  "pandas",
  "plyfile",
  "pymcubes",
  "rembg",
  "roma",
  "safetensors",
  "scikit-image==0.20.0",
  "scipy>=1.11,<1.12",
  "smplx",
  "tensorboard",
  "torch==2.3.0",
  "torchvision==0.18.0",
  "transformers>=4.41",
  "trimesh>=4.0",
  "typeguard",
  "tyro",
  "xformers==0.0.26.post1"
]
# CUDA-from-source + chumpy: built from git/sdist with build isolation OFF so
# they compile against the torch already in the env. uv builds these on
# `uv sync --extra gpu --extra cuda` via no-build-isolation-package +
# extra-build-dependencies below. (chumpy also needs the lam/method.py shim.)
cuda = [
  "chumpy",
  "nvdiffrast",
  "pytorch3d",
  "simple-knn"
]

[tool.hatch.build.targets.wheel]
packages = ["src/splattie"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
ignore = [
  "ANN202",
  "ANN401",
  "ARG002",
  "BLE001",
  "COM812",
  "D100",
  "D102",
  "D104",
  "D107",
  "D203",
  "D211",
  "D213",
  "E501",
  "ERA001",
  "F722",
  "F821",
  "FIX002",
  "G004",
  "ISC001",
  "PLC0415",
  "PLR0913",
  "PLR2004",
  "PLW0603",
  "S603",
  "S607",
  "T201",
  "TC001",
  "TC002",
  "TC003",
  "TD003",
  "UP037"
]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D103", "S101"]

[tool.uv]
# Build these against the already-installed torch (they import torch at build
# time). uv installs their extra-build-dependencies first, then builds them
# without isolation — so they live in pyproject, not an ad-hoc pip step.
no-build-isolation-package = ["pytorch3d", "nvdiffrast", "simple-knn", "chumpy"]

[tool.uv.extra-build-dependencies]
pytorch3d = ["torch", "ninja", "setuptools"]
nvdiffrast = ["torch", "setuptools"]
simple-knn = ["torch", "setuptools"]
chumpy = ["pip", "setuptools"]

[[tool.uv.index]]
explicit = true
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"

[tool.uv.sources]
pytorch3d = {git = "https://github.com/facebookresearch/pytorch3d.git"}
nvdiffrast = {git = "https://github.com/ShenhanQian/nvdiffrast", branch = "backface-culling"}
simple-knn = {git = "https://github.com/camenduru/simple-knn"}
torch = {index = "pytorch-cu121"}
torchvision = {index = "pytorch-cu121"}
xformers = {index = "pytorch-cu121"}
