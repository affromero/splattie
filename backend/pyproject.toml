[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
  "huggingface-hub==0.23.2",
  "httpx>=0.28.0",
  "pre-commit>=4.0",
  "pytest-asyncio>=0.25.0",
  "pytest>=8.0",
  "ruff>=0.14",
  "toml-sort>=0.24"
]

[project]
authors = [{ name = "Andrés Romero", email = "me@afromero.co" }]
dependencies = [
  "beartype>=0.19.0",
  "fastapi>=0.115.0",
  "jaxtyping>=0.2.34",
  "klogr>=0.2",
  "numpy>=1.23,<2",
  "pillow>=13.0.0",
  "pydantic>=2.10",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "tyro>=0.8",
  "uvicorn[standard]>=0.30.0"
]
name = "splattie"
requires-python = ">=3.11,<3.12"
version = "0.3.3"

[project.optional-dependencies]
# CPU-only: enough to run the FastAPI server (GPU routes return 503).
# uv sync --extra cpu
cpu = [
  "fast-simplification",
  "plyfile",
  "scipy>=1.11,<1.12",
  "trimesh>=4.0"
]
# Full GPU pipeline: head-generation with LAM + FLAME. Requires CUDA 12.x.
# uv sync --extra gpu
# Additional CUDA extensions (pytorch3d, nvdiffrast, simple-knn) are
# installed by scripts/setup-gpu.sh because they need --no-build-isolation.
gpu = [
  "accelerate",
  "boto3",
  "cython<3",
  "decord",
  "diffusers>=0.32",
  "easydict",
  "einops",
  "fast-simplification",
  "face-detection-tflite",
  "flash-attn==2.5.9.post1",
  "gsplat",
  "fvcore",
  "h5py",
  "huggingface-hub==0.23.2",
  "igraph",
  "imageio",
  "imageio-ffmpeg",
  "jsonargparse",
  "kaolin @ https://nvidia-kaolin.s3.us-east-2.amazonaws.com/torch-2.3.0_cu121/kaolin-0.18.0-cp311-cp311-linux_x86_64.whl ; python_version == '3.11' and platform_system == 'Linux' and platform_machine == 'x86_64'",
  "kornia",
  "libigl==2.5.1",
  "lightning>=2.6.6",
  "loguru",
  "matplotlib",
  "mesh2sdf",
  "moviepy>=1.0",
  "ninja",
  "omegaconf>=2.3",
  "onnxruntime",
  "opencv-python-headless>=4.10",
  "open3d",
  "pandas",
  "plyfile",
  "ptlflow",
  "pymcubes",
  "pymeshlab",
  "pymeshfix",
  "pyrender",
  "pytz",
  "pyvista",
  "rembg",
  "roma",
  "safetensors",
  "scikit-image==0.20.0",
  "scikit-learn",
  "scipy>=1.11,<1.12",
  "smplx",
  "spconv-cu120",
  "tensorboard",
  "tetgen==0.5.2",
  "timm",
  "torch==2.3.0",
  "torch-scatter @ https://data.pyg.org/whl/torch-2.3.0%2Bcu121/torch_scatter-2.1.2%2Bpt23cu121-cp311-cp311-linux_x86_64.whl ; python_version == '3.11' and platform_system == 'Linux' and platform_machine == 'x86_64'",
  "torchvision==0.18.0",
  "transformers>=4.41",
  "trimesh>=4.0",
  "typeguard",
  "tyro",
  "utils3d",
  "xatlas",
  "xformers==0.0.26.post1",
  "yacs"
]
# CUDA extensions compile against the torch already installed in the environment.
# `uv sync --extra gpu --extra cuda` uses no-build-isolation-package below for
# those extensions. Chumpy uses an isolated build with its declared tooling
# and still needs the lam/method.py runtime shim.
cuda = [
  "chumpy",
  "nvdiffrast",
  "pytorch3d",
  "simple-knn"
]

[project.scripts]
splattie = "splattie.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/splattie"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
ignore = [
  "ANN202",
  "ANN401",
  "ARG002",
  "BLE001",
  "COM812",
  "CPY001",
  "D100",
  "D102",
  "D104",
  "D107",
  "D203",
  "D211",
  "D213",
  "E501",
  "ERA001",
  "F722",
  "F821",
  "FIX002",
  "G004",
  "ISC001",
  "PLC0415",
  "PLR0913",
  "PLR2004",
  "PLW0603",
  "S603",
  "S607",
  "T201",
  "TC001",
  "TC002",
  "TC003",
  "TD003",
  "UP037"
]
select = ["ALL"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI uses these as argument defaults by design (B008 false positives).
extend-immutable-calls = ["fastapi.Body", "fastapi.Depends", "fastapi.Path", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D103", "S101"]
"scripts/**" = ["INP001"]

[tool.uv]
# Build these against the already-installed torch (they import torch at build
# time). uv builds them after their dependencies are installed. Chumpy uses an
# isolated build with its declared tooling, since it does not compile against torch.
no-build-isolation-package = ["pytorch3d", "nvdiffrast", "simple-knn", "tetgen", "flash-attn"]

[tool.uv.extra-build-dependencies]
pytorch3d = ["torch", "ninja", "setuptools"]
nvdiffrast = ["torch", "setuptools"]
simple-knn = ["torch", "setuptools"]
chumpy = ["pip", "setuptools", "wheel"]
tetgen = ["cython<3", "numpy", "setuptools"]
flash-attn = ["torch", "ninja", "packaging", "setuptools"]

[[tool.uv.index]]
explicit = true
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"

[tool.uv.sources]
accelerate = { git = "https://github.com/affromero/accelerate.git", rev = "5084e3bb086b06e80896a0af1f24dbc227abc961" }
diffusers = { git = "https://github.com/affromero/diffusers.git", rev = "fd7d786285e0b6dadbec12ca7d524d3cfc84cdb6" }
flash-attn = [
  { url = "https://github.com/affromero/flash-attention/releases/download/security-2.5.9.post1-1/flash_attn-2.5.9.post1%2Bsecurity.1-cp311-cp311-linux_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
  { git = "https://github.com/affromero/flash-attention.git", rev = "db2807cc1be6040b001c344b0d542d23e45a515e", marker = "sys_platform != 'linux' or platform_machine != 'x86_64'" }
]
rembg = { git = "https://github.com/affromero/rembg.git", rev = "f56c058f39d7d17813e3b9059e77858fb3e14447" }
transformers = { git = "https://github.com/affromero/transformers.git", rev = "3a2715cc85233d2477bc509df395f4b8791dc26f" }
pytorch3d = { git = "https://github.com/facebookresearch/pytorch3d.git" }
nvdiffrast = { git = "https://github.com/ShenhanQian/nvdiffrast", branch = "backface-culling" }
simple-knn = { git = "https://github.com/camenduru/simple-knn" }
torch = [
  { url = "https://github.com/affromero/pytorch/releases/download/security-2.3.0-cu121-1/torch-2.3.0%2Bcu121.security1-cp311-cp311-manylinux_2_35_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
  { git = "https://github.com/affromero/pytorch.git", rev = "1bb7c43f24b73280de6e3734cd3a51d3c35c6216", marker = "sys_platform != 'linux' or platform_machine != 'x86_64'" }
]
torchvision = { index = "pytorch-cu121" }
utils3d = { git = "https://github.com/EasternJournalist/utils3d.git", rev = "9a4eb15e4021b67b12c460c7057d642626897ec8" }
xformers = { index = "pytorch-cu121" }
