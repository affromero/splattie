[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "pre-commit>=4.0",
  "pytest-asyncio>=0.25.0",
  "pytest>=8.0",
  "ruff>=0.14",
  "toml-sort>=0.24",
]

[project]
authors = [{name = "Andrés Romero", email = "me@afromero.co"}]
dependencies = [
  "beartype>=0.19.0",
  "fastapi>=0.115.0",
  "jaxtyping>=0.2.34",
  "numpy>=1.23,<2",
  "pillow>=10.0",
  "pydantic>=2.10",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.0",
]
name = "mirada"
requires-python = ">=3.10"
version = "0.1.0"

[project.optional-dependencies]
gpu = [
  "einops",
  "diffusers>=0.32",
  "loguru",
  "moviepy>=1.0",
  "omegaconf>=2.3",
  "opencv-python-headless>=4.10",
  "plyfile",
  "safetensors",
  "scipy>=1.11,<1.12",
  "transformers>=4.41",
  "trimesh>=4.0",
  "tyro",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mirada"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
ignore = [
  "ANN202",
  "ANN401",
  "ARG002",
  "BLE001",
  "COM812",
  "D100",
  "D102",
  "D104",
  "D107",
  "D203",
  "D211",
  "D213",
  "E501",
  "ERA001",
  "F722",
  "F821",
  "FIX002",
  "G004",
  "ISC001",
  "PLC0415",
  "PLR0913",
  "PLR2004",
  "PLW0603",
  "S603",
  "S607",
  "T201",
  "TC001",
  "TC002",
  "TC003",
  "TD003",
  "UP037",
]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D103", "S101"]
