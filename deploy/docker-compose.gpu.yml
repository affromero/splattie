---
# Splattie self-host stack with the full GPU generation backend.
#
# Runs heads (LAM), bodies (LHM), objects (TRELLIS + Puppeteer rigging), and a
# web UI with /create enabled. Requires an NVIDIA GPU plus the NVIDIA container
# toolkit on the host. The public splattie.app deploy does not use this stack;
# see deploy/docker-compose.prod.yml for the CPU serving stack.
#
# Build the GPU image once (slow, multi-GB) then bring up:
#   infisical run --projectId daa85a1a-5d47-45f0-bf90-1401d8275c30 --env prod -- docker compose -f deploy/docker-compose.gpu.yml up -d --build
# Or supply ADMIN_* through a local .env file.
services:
    web:
        build:
            context: ..
            dockerfile: apps/web/Dockerfile
            args:
                # Baked into the client bundle at build time.
                NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
                NEXT_PUBLIC_SELF_HOST: 'true'
        ports:
            - 4001:4001
        environment:
            - BACKEND_INTERNAL_URL=http://gpu-backend:8000
            - ADMIN_PASSWORD=${ADMIN_PASSWORD:?provide ADMIN_PASSWORD via Infisical or .env}
            - SESSION_SECRET=${SESSION_SECRET:?provide SESSION_SECRET via Infisical or .env}
            - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:?provide ADMIN_API_TOKEN via Infisical or .env}
            - GOOGLE_SITE_VERIFICATION=${GOOGLE_SITE_VERIFICATION:-}
        depends_on:
            gpu-backend:
                condition: service_healthy
        restart: unless-stopped

    gpu-backend:
        build:
            context: ..
            dockerfile: backend/Dockerfile
        ports:
            - 8000:8000
        environment:
            - NVIDIA_VISIBLE_DEVICES=all
            - NVIDIA_DRIVER_CAPABILITIES=compute,utility
            - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:?provide ADMIN_API_TOKEN via Infisical or .env}
            - STATS_SALT=${STATS_SALT:-}
        volumes:
            - gpu-backend-data:/app/backend/data
        gpus: all
        shm_size: 16gb
        restart: unless-stopped
        healthcheck:
            test: [CMD, curl, -fsS, http://localhost:8000/health]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 45s
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: 1
                          capabilities: [gpu]

volumes:
    gpu-backend-data:
