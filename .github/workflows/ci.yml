---
name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]
        paths:
            - apps/**
            - package.json
            - package-lock.json
            - tsconfig.base.json
            - eslint.config.mjs

jobs:
    frontend:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
            - run: npm run lint
            - run: npm run type-check
            - run: npm run test
            - run: npm run build
