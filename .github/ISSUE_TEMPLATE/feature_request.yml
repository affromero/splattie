---
name: Feature request
description: Suggest an improvement or new capability
title: '[Feature]: '
labels: [enhancement]
body:
    - type: textarea
      id: problem
      attributes:
          label: What problem would this solve?
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: Proposed solution
          description: What would you like Splattie to do?
      validations:
          required: false
    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered
      validations:
          required: false
