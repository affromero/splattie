---
version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      open-pull-requests-limit: 1
      groups:
          npm-all:
              applies-to: version-updates
              patterns:
                  - '*'
          npm-security:
              applies-to: security-updates
              patterns:
                  - '*'
      ignore:
          # eslint 10 crashes eslint-plugin-react through eslint-config-next 16
          # (context.getFilename removed). Drop when eslint-config-next supports it.
          - dependency-name: eslint
            update-types: [version-update:semver-major]
          - dependency-name: typescript
            update-types: [version-update:semver-major]
    - package-ecosystem: uv
      directory: /backend
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      open-pull-requests-limit: 1
      groups:
          python-all:
              applies-to: version-updates
              patterns:
                  - '*'
          python-security:
              applies-to: security-updates
              patterns:
                  - '*'
    - package-ecosystem: docker
      directories:
          - /apps/web
          - /backend
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      open-pull-requests-limit: 1
      ignore:
          # torch 2.3.0 and every CUDA extension are built against cu121; the
          # base image moves only with a deliberate torch/CUDA migration.
          - dependency-name: nvidia/cuda
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      open-pull-requests-limit: 1
      groups:
          actions-all:
              applies-to: version-updates
              patterns:
                  - '*'
          actions-security:
              applies-to: security-updates
              patterns:
                  - '*'
